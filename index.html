<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drinco-Mene — Contato</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="avatar">
        <!-- Foto enviada no repositório -->
        <img class="avatar-img" src="WhatsApp%20Image%202026-08-05%20at%2007.14.45.jpeg" alt="Foto de Drinco-Mene" />
      </div>

      <h1 class="name" data-key="name">Drinco-Mene</h1>
      <p class="role" data-key="role">Desenvolvedor • Criativo • Sempre aprendendo ✨</p>

      <p class="bio" data-key="bio">
        Olá! Aqui estão todas as minhas formas de contato. Clique nos botões — eles se mexem quando você passa o cursor 😊
      </p>

      <div class="contacts">
        <!-- Botões em linhas separadas; removida a opção EA conforme solicitado -->
        <a class="btn" href="mailto:seu-email@exemplo.com" aria-label="Enviar e-mail" data-key="email">
          <img class="btn-icon" src="assets/email.png" alt="Email logo" onerror="this.style.display='none'">
          <span class="btn-text">📧 Email</span>
        </a>

        <a class="btn" href="https://github.com/Drinco-Mene" target="_blank" rel="noopener" aria-label="GitHub" data-key="github">
          <img class="btn-icon" src="assets/github.png" alt="GitHub logo" onerror="this.style.display='none'">
          <span class="btn-text">💻 GitHub</span>
        </a>

        <a class="btn" href="https://account.xbox.com/pt-BR/Profile?gamertag=DrincoMene" target="_blank" rel="noopener" aria-label="Xbox" data-key="xbox">
          <img class="btn-icon" src="assets/xbox.png" alt="Xbox logo" onerror="this.style.display='none'">
          <span class="btn-text">🎮 Xbox</span>
        </a>

        <a class="btn" href="https://steamcommunity.com/id/DrincoMene/" target="_blank" rel="noopener" aria-label="Steam" data-key="steam">
          <img class="btn-icon" src="assets/steam.png" alt="Steam logo" onerror="this.style.display='none'">
          <span class="btn-text">🕹️ Steam</span>
        </a>

        <a class="btn" href="https://instagram.com/ka_uadasilva" target="_blank" rel="noopener" aria-label="Instagram" data-key="instagram">
          <img class="btn-icon" src="assets/instagram.png" alt="Instagram logo" onerror="this.style.display='none'">
          <span class="btn-text">📸 Instagram</span>
        </a>
      </div>

      <footer class="foot">
        <p>Preferências: 
          <span class="chip lang active" data-lang="pt">Português 🇧🇷</span>
          <span class="chip lang" data-lang="en">English 🇺🇸</span>
        </p>
        <p class="small" data-key="footer">Feito com ❤️ — Drinco-Mene</p>
      </footer>
    </section>
  </main>

  <script>
    // Pequeno script para alternar idioma (pt/en)
    (function(){
      const translations = {
        pt: {
          name: 'Drinco-Mene',
          role: 'Desenvolvedor • Criativo • Sempre aprendendo ✨',
          bio: 'Olá! Aqui estão todas as minhas formas de contato. Clique nos botões — eles se mexem quando você passa o cursor 😊',
          email: '📧 Email',
          github: '💻 GitHub',
          xbox: '🎮 Xbox',
          steam: '🕹️ Steam',
          instagram: '📸 Instagram',
          footer: 'Feito com ❤️ — Drinco-Mene'
        },
        en: {
          name: 'Drinco-Mene',
          role: 'Developer • Creative • Always learning ✨',
          bio: 'Hi! Here are my contact links. Click the buttons — they move when you hover 😊',
          email: '📧 Email',
          github: '💻 GitHub',
          xbox: '🎮 Xbox',
          steam: '🕹️ Steam',
          instagram: '📸 Instagram',
          footer: 'Made with ❤️ — Drinco-Mene'
        }
      };

      function setLanguage(lang){
        document.documentElement.lang = (lang === 'en') ? 'en' : 'pt-BR';
        document.querySelectorAll('[data-key]').forEach(el => {
          const key = el.getAttribute('data-key');
          if(key && translations[lang] && translations[lang][key]){
            el.textContent = translations[lang][key];
          }
        });
        document.querySelectorAll('.chip.lang').forEach(ch => {
          ch.classList.toggle('active', ch.getAttribute('data-lang') === lang);
        });
      }

      document.querySelectorAll('.chip.lang').forEach(ch => {
        ch.addEventListener('click', () => setLanguage(ch.getAttribute('data-lang')));
      });

      setLanguage('pt');
    })();
  </script>
</body>
</html>
